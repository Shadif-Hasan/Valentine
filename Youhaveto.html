<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine 💘</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding-top: 120px;
      position: relative;
      z-index: 2;
    }

    h1, p {
      color: white;
      margin: 0;
      padding: 0 10px;
    }

    h1 {
      font-size: 2.6em;
    }

    p {
      font-size: 1.3em;
      margin-top: 20px;
      transition: 0.3s;
    }

    button {
      padding: 15px 32px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 20px;
      transition: transform 0.2s;
      touch-action: manipulation;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    #no {
      background-color: white;
      color: #ff4d6d;
      position: absolute;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
      z-index: 1;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .container {
        padding-top: 80px;
      }

      h1 {
        font-size: 2em;
      }

      p {
        font-size: 1.1em;
      }

      button {
        font-size: 16px;
        padding: 12px 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>আমার ভ্যালেন্টাইন হবে? 💖</h1>
    <p id="message">আমি তোমাকে হাসাতে আর ভালোবাসতে চাই আজীবন 💕</p>

    <button id="yes">হ্যাঁ 💕</button>
    <button id="no">না 💔</button>
  </div>

  <script>
    const noButton = document.getElementById("no");
    const yesButton = document.getElementById("yes");
    const message = document.getElementById("message");

    const messages = [
      "এত সহজে না বলা যাবে না 😌",
      "আমার মন তো আগেই তোমাকে বেছে নিয়েছে 💘",
      "তুমি না বললেও ভাগ্য কিন্তু রাজি 😏",
      "তুমি জানো আমিই তোমার মানুষ 💖",
      "আর কত পালাবে? 😌",
      "আমাদের গল্প তো শুরু হয়েই গেছে 💫",
      "একটু সাহস করো 💕"
    ];

    let index = 0;
    let scale = 1;

    function moveNoButton() {
      const x = Math.random() * (window.innerWidth - noButton.offsetWidth);
      const y = Math.random() * (window.innerHeight - noButton.offsetHeight);

      noButton.style.left = `${x}px`;
      noButton.style.top = `${y}px`;

      // shrink but keep readable
      scale -= 0.05;
      if (scale < 0.75) scale = 0.75;
      noButton.style.transform = `scale(${scale})`;

      message.textContent = messages[index % messages.length];
      index++;
    }

    /* 🖱 Cursor distance detection (PC) */
    document.addEventListener("mousemove", (e) => {
      const rect = noButton.getBoundingClientRect();
      const buttonX = rect.left + rect.width / 2;
      const buttonY = rect.top + rect.height / 2;

      const distance = Math.hypot(
        e.clientX - buttonX,
        e.clientY - buttonY
      );

      if (distance < 120) {
        moveNoButton();
      }
    });

    /* 📱 Mobile tap escape */
    noButton.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    });

    // YES CLICKED
    yesButton.addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="text-align:center; margin-top:180px; color:white; padding:20px;">
          <h1 style="font-size:3em;">তাহলে ঠিক হয়ে গেল 💘</h1>
          <p style="font-size:1.5em; margin-top:20px;">
            এখন তুমি আমার… আর কোনো পালানোর রাস্তা নেই 😌
          </p>
          <p style="font-size:1.2em; margin-top:15px;">
            আমি কথা দিচ্ছি,<br>
            তোমার যত্ন নেব,<br>
            আর প্রতিদিন তোমাকে হাসাবো 💕
          </p>
          <p style="font-size:1.4em; margin-top:25px;">
            আমাদের গল্প এখান থেকেই শুরু 💖
          </p>
        </div>
      `;
    });

    // Floating hearts
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (4 + Math.random() * 3) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }, 400);
  </script>

</body>
</html>
